<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B45" />
      <stop offset="100%" stop-color="#0A2228" />
    </linearGradient>

    <!-- Droplet Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="60%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#094A46" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E0F2F1" stop-opacity="1" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded rectangle (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Telemetry Radar Arc 1 -->
  <path d="M 128 290 A 140 140 0 0 1 384 290" fill="none" stroke="#0F766E" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Mid Telemetry Pulse Arc 2 -->
  <path d="M 160 310 A 105 105 0 0 1 352 310" fill="none" stroke="#2DD4BF" stroke-width="14" stroke-linecap="round" opacity="0.75" />

  <!-- Central Water Droplet Emblem -->
  <path d="M 256 112 C 256 112 170 230 170 296 A 86 86 0 0 0 342 296 C 342 230 256 112 256 112 Z" fill="url(#dropGrad)" filter="url(#glow)" />

  <!-- Inner Water Ripple Lines inside Droplet -->
  <path d="M 200 300 Q 256 325 312 300" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 220 265 Q 256 285 292 265" fill="none" stroke="#E0F2F1" stroke-width="8" stroke-linecap="round" opacity="0.9" />

  <!-- Sensor Spark / IoT Pulse Node -->
  <circle cx="256" cy="188" r="14" fill="#FFFFFF" opacity="0.95" />
  <circle cx="256" cy="188" r="24" fill="#2DD4BF" opacity="0.4" />
</svg>
